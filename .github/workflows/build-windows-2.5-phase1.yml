name: Build RB VideoFire 2.5.0 Phase 1 Workspace Shell

on:
  workflow_dispatch:
  push:
    branches:
      - rb-videofire-2.5.0-multi-workspace-post

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 3.27.x

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install tools
        shell: pwsh
        run: |
          choco install ninja nsis -y
          Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\NSIS'

      - name: Extract native source baseline
        shell: pwsh
        run: Expand-Archive -Path 'RB_VideoFire_2.0.0_Alpha_Native_Avid_Editorial_Core_Cumulative_OneClick.zip' -DestinationPath source

      - name: Apply cumulative RB VideoFire through 2.4
        shell: pwsh
        run: |
          $root = Resolve-Path 'source/RB_VideoFire_2.0.0_Alpha_Native'
          python .github/scripts/apply-rbvf-2.1.py "$root" ".github/assets"
          $svg=Resolve-Path '.github/assets/rb-videofire.svg'
          $png=Join-Path $root 'app/ui/graphics/rb-videofire.png'
          $ico=Join-Path $root 'app/packaging/windows/rb-videofire.ico'
          magick -background none $svg -resize 256x256 -depth 8 -strip -define png:color-type=6 $png
          magick $png -define icon:auto-resize=256,128,64,48,32,24,16 $ico
          $audit=Join-Path $root 'tools/audit-package.ps1'
          $auditText=Get-Content $audit -Raw
          $auditText=$auditText.Replace('-match "Record Monitor") "Record Monitor não aplicado."','-match "Program Monitor") "Program Monitor não aplicado."')
          Set-Content -Path $audit -Value $auditText -Encoding UTF8
          python .github/scripts/validate-rbvf-2.1.py "$root"
          python .github/scripts/apply-rbvf-2.1.1.py "$root"
          $fixed=Join-Path $root 'app/ui/graphics/rb-videofire-fixed.png'
          magick $png -resize 256x256 -depth 8 -strip -define png:color-type=6 $fixed
          Move-Item -Force $fixed $png
          magick $png -define icon:auto-resize=256,128,64,48,32,24,16 $ico
          python .github/scripts/validate-rbvf-2.1.1.py "$root"
          python .github/scripts/apply-rbvf-2.2.py "$root"
          python .github/scripts/apply-rbvf-2.2-core.py "$root"
          python .github/scripts/validate-rbvf-2.2.py "$root"
          python .github/scripts/apply-rbvf-2.2.1.py "$root"
          python .github/scripts/validate-rbvf-2.2.1.py "$root"
          python .github/scripts/apply-rbvf-2.3.py "$root"
          python .github/scripts/validate-rbvf-2.3.py "$root"
          python .github/scripts/apply-rbvf-2.4.py "$root"
          python .github/scripts/validate-rbvf-2.4.py "$root"

      - name: Verify 2.5 phase 1 starts RED
        shell: pwsh
        run: |
          $root=Resolve-Path 'source/RB_VideoFire_2.0.0_Alpha_Native'
          python .github/scripts/validate-rbvf-2.5-phase1.py "$root"
          if ($LASTEXITCODE -eq 0) { throw '2.5 phase 1 validator unexpectedly passed before implementation' }
          Write-Host 'RED confirmed for 2.5 phase 1 workspace shell.'
          $global:LASTEXITCODE=0

      - name: Apply and validate 2.5 phase 1
        shell: pwsh
        run: |
          $root=Resolve-Path 'source/RB_VideoFire_2.0.0_Alpha_Native'
          python .github/scripts/apply-rbvf-2.5-phase1.py "$root"
          python .github/scripts/validate-rbvf-2.5-phase1.py "$root"

      - name: Acquire native dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deps | Out-Null
          Set-Location deps
          curl.exe -fL 'https://github.com/olive-editor/dependencies/releases/download/continuous/olive-dep-win32-Release.tar.gz' -o native-deps.tar.gz
          tar -xzf native-deps.tar.gz
          "NATIVE_DEPS_ROOT=$((Get-Location).Path)\install" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$((Get-Location).Path)\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure build
        shell: pwsh
        run: |
          $root=Resolve-Path 'source/RB_VideoFire_2.0.0_Alpha_Native'
          cmake -S $root -B "$root/build-native" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DCMAKE_PREFIX_PATH="$env:NATIVE_DEPS_ROOT"

      - name: Compile
        shell: pwsh
        run: cmake --build source/RB_VideoFire_2.0.0_Alpha_Native/build-native --config Release

      - name: Test
        shell: pwsh
        run: ctest --test-dir source/RB_VideoFire_2.0.0_Alpha_Native/build-native -C Release --output-on-failure

      - name: Deploy runtime
        shell: pwsh
        run: |
          $root=Resolve-Path 'source/RB_VideoFire_2.0.0_Alpha_Native'
          $build=Join-Path $root 'build-native'
          $dist=Join-Path $root 'dist'
          $portable=Join-Path $dist 'portable'
          New-Item -ItemType Directory -Force $portable | Out-Null
          $exe=Get-ChildItem $build -Filter RBVideoFire.exe -Recurse | Select-Object -First 1
          if(-not $exe){throw 'RBVideoFire.exe not produced'}
          Copy-Item $exe.FullName $portable
          windeployqt --release --no-translations --compiler-runtime (Join-Path $portable 'RBVideoFire.exe')
          Copy-Item "$env:NATIVE_DEPS_ROOT/bin/*.dll" $portable -Force
          Get-ChildItem $portable -Filter *.pdb -Recurse | Remove-Item -Force
          Copy-Item "$root/LICENSE" "$portable/LICENSE.txt"

      - name: Startup smoke test
        shell: pwsh
        run: |
          $root=Resolve-Path 'source/RB_VideoFire_2.0.0_Alpha_Native'
          $portable=Join-Path $root 'dist/portable'
          $exe=Join-Path $portable 'RBVideoFire.exe'
          $stdout=Join-Path $env:RUNNER_TEMP 'rbvf-out.txt'
          $stderr=Join-Path $env:RUNNER_TEMP 'rbvf-err.txt'
          $env:QT_OPENGL='software'
          $p=Start-Process -FilePath $exe -WorkingDirectory $portable -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 8
          $combined="$(if(Test-Path $stdout){Get-Content $stdout -Raw})`n$(if(Test-Path $stderr){Get-Content $stderr -Raw})"
          if($p.HasExited){throw "RBVideoFire.exe exited during startup: $($p.ExitCode) $combined"}
          if($combined -match '(?i)\[FATAL\]|QPixmap: Must construct|libpng error|bad adaptive filter'){
            Stop-Process -Id $p.Id -Force
            throw "Startup regression: $combined"
          }
          Stop-Process -Id $p.Id -Force

      - name: Package installer
        shell: pwsh
        run: |
          $root=Resolve-Path 'source/RB_VideoFire_2.0.0_Alpha_Native'
          $portable=Join-Path $root 'dist/portable'
          powershell -NoProfile -ExecutionPolicy Bypass -File "$root/tools/audit-package.ps1" -Root $root -Portable $portable
          makensis /DX64 "/DSOURCE_ROOT=$root" "$root/packaging/rb-videofire/RBVideoFire.nsi"
          $installer=Join-Path $root 'dist/RB VideoFire Setup 2.5.0 Alpha Multi-Workspace Post.exe'
          if(-not(Test-Path $installer)){throw '2.5 installer was not produced'}
          powershell -NoProfile -ExecutionPolicy Bypass -File "$root/tools/audit-package.ps1" -Root $root -Portable $portable -Installer $installer
          Write-Host "INSTALLER_SHA256=$((Get-FileHash $installer -Algorithm SHA256).Hash)"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RB-VideoFire-2.5.0-Phase1-Workspace-Shell-Installer
          path: source/RB_VideoFire_2.0.0_Alpha_Native/dist/RB VideoFire Setup 2.5.0 Alpha Multi-Workspace Post.exe
          if-no-files-found: error
