name: Build RB VideoFire 2.4.0 M4 Media Intelligence

on:
  workflow_dispatch:
  push:
    branches:
      - rb-videofire-2.4.0-m4-media-intelligence

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 3.27.x
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install tools
        shell: pwsh
        run: |
          choco install ninja nsis -y
          Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\NSIS'

      - name: Extract native source baseline
        shell: pwsh
        run: Expand-Archive -Path 'RB_VideoFire_2.0.0_Alpha_Native_Avid_Editorial_Core_Cumulative_OneClick.zip' -DestinationPath source

      - name: Apply cumulative RB VideoFire through M3
        shell: pwsh
        run: |
          $root = Resolve-Path 'source/RB_VideoFire_2.0.0_Alpha_Native'
          python .github/scripts/apply-rbvf-2.1.py "$root" ".github/assets"
          $svg=Resolve-Path '.github/assets/rb-videofire.svg'; $png=Join-Path $root 'app/ui/graphics/rb-videofire.png'; $ico=Join-Path $root 'app/packaging/windows/rb-videofire.ico'
          magick -background none $svg -resize 256x256 -depth 8 -strip -define png:color-type=6 $png
          magick $png -define icon:auto-resize=256,128,64,48,32,24,16 $ico
          $audit=Join-Path $root 'tools/audit-package.ps1'; $auditText=Get-Content $audit -Raw; $auditText=$auditText.Replace('-match "Record Monitor") "Record Monitor não aplicado."','-match "Program Monitor") "Program Monitor não aplicado."'); Set-Content -Path $audit -Value $auditText -Encoding UTF8
          python .github/scripts/validate-rbvf-2.1.py "$root"
          python .github/scripts/apply-rbvf-2.1.1.py "$root"
          $fixed=Join-Path $root 'app/ui/graphics/rb-videofire-fixed.png'; magick $png -resize 256x256 -depth 8 -strip -define png:color-type=6 $fixed; Move-Item -Force $fixed $png; magick $png -define icon:auto-resize=256,128,64,48,32,24,16 $ico
          python .github/scripts/validate-rbvf-2.1.1.py "$root"
          python .github/scripts/apply-rbvf-2.2.py "$root"
          python .github/scripts/apply-rbvf-2.2-core.py "$root"
          python .github/scripts/validate-rbvf-2.2.py "$root"
          python .github/scripts/apply-rbvf-2.2.1.py "$root"
          python .github/scripts/validate-rbvf-2.2.1.py "$root"
          python .github/scripts/apply-rbvf-2.3.py "$root"
          python .github/scripts/validate-rbvf-2.3.py "$root"
          python .github/scripts/apply-rbvf-2.4.py "$root"
          python .github/scripts/validate-rbvf-2.4.py "$root"
          python .github/scripts/apply-rbvf-2.4-audio-m1.py "$root"
          python .github/scripts/test-rbvf-2.4-audio-m1.py "$root"
          python .github/scripts/apply-rbvf-2.4-workspace-m2.py "$root"
          python .github/scripts/test-rbvf-2.4-workspace-m2.py "$root"
          python .github/scripts/apply-rbvf-m3-editorial.py "$root"
          python .github/scripts/test-rbvf-m3-editorial.py "$root"

      - name: M4 Media RED
        shell: pwsh
        run: |
          $root=Resolve-Path 'source/RB_VideoFire_2.0.0_Alpha_Native'
          python .github/scripts/test-rbvf-m4-media-contract.py "$root"
          if ($LASTEXITCODE -eq 0) { throw 'M4 media unexpectedly passed before implementation' }
          Write-Host 'RED confirmed for M4 Media Intelligence.'
          $global:LASTEXITCODE=0

      - name: Apply M4 Media core and verify GREEN
        shell: pwsh
        run: |
          $root=Resolve-Path 'source/RB_VideoFire_2.0.0_Alpha_Native'
          python .github/scripts/apply-rbvf-m4-media.py "$root"
          python .github/scripts/test-rbvf-m4-media-contract.py "$root"
          python .github/scripts/test-rbvf-m3-editorial.py "$root"
          python .github/scripts/test-rbvf-2.4-workspace-m2.py "$root"
          python .github/scripts/test-rbvf-2.4-audio-m1.py "$root"

      - name: Acquire native dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deps | Out-Null
          Set-Location deps
          curl.exe -fL 'https://github.com/olive-editor/dependencies/releases/download/continuous/olive-dep-win32-Release.tar.gz' -o native-deps.tar.gz
          tar -xzf native-deps.tar.gz
          "NATIVE_DEPS_ROOT=$((Get-Location).Path)\install" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$((Get-Location).Path)\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure build
        shell: pwsh
        run: |
          $root=Resolve-Path 'source/RB_VideoFire_2.0.0_Alpha_Native'
          cmake -S $root -B "$root/build-native" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DCMAKE_PREFIX_PATH="$env:NATIVE_DEPS_ROOT"

      - name: Compile
        shell: pwsh
        run: cmake --build source/RB_VideoFire_2.0.0_Alpha_Native/build-native --config Release

      - name: Test
        shell: pwsh
        run: ctest --test-dir source/RB_VideoFire_2.0.0_Alpha_Native/build-native -C Release --output-on-failure

      - name: Deploy runtime
        shell: pwsh
        run: |
          $root=Resolve-Path 'source/RB_VideoFire_2.0.0_Alpha_Native'; $build=Join-Path $root 'build-native'; $dist=Join-Path $root 'dist'; $portable=Join-Path $dist 'portable'
          New-Item -ItemType Directory -Force $portable | Out-Null
          $exe=Get-ChildItem $build -Filter RBVideoFire.exe -Recurse | Select-Object -First 1; if(-not $exe){throw 'RBVideoFire.exe not produced'}
          Copy-Item $exe.FullName $portable
          windeployqt --release --no-translations --compiler-runtime (Join-Path $portable 'RBVideoFire.exe')
          Copy-Item "$env:NATIVE_DEPS_ROOT/bin/*.dll" $portable -Force
          Get-ChildItem $portable -Filter *.pdb -Recurse | Remove-Item -Force
          Copy-Item "$root/LICENSE" "$portable/LICENSE.txt"

      - name: Startup smoke test
        shell: pwsh
        run: |
          $root=Resolve-Path 'source/RB_VideoFire_2.0.0_Alpha_Native'; $portable=Join-Path $root 'dist/portable'; $exe=Join-Path $portable 'RBVideoFire.exe'; $stdout=Join-Path $env:RUNNER_TEMP 'rbvf-out.txt'; $stderr=Join-Path $env:RUNNER_TEMP 'rbvf-err.txt'; $env:QT_OPENGL='software'
          $p=Start-Process -FilePath $exe -WorkingDirectory $portable -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 8
          $combined="$(if(Test-Path $stdout){Get-Content $stdout -Raw})`n$(if(Test-Path $stderr){Get-Content $stderr -Raw})"
          if($p.HasExited){throw "RBVideoFire.exe exited during startup: $($p.ExitCode) $combined"}
          if($combined -match '(?i)\[FATAL\]|QPixmap: Must construct|libpng error|bad adaptive filter'){Stop-Process -Id $p.Id -Force; throw "Startup regression: $combined"}
          Stop-Process -Id $p.Id -Force

      - name: Contract build checkpoint
        shell: pwsh
        run: |
          $root=Resolve-Path 'source/RB_VideoFire_2.0.0_Alpha_Native'
          python .github/scripts/test-rbvf-m4-media-contract.py "$root"
          Write-Host 'M4 core checkpoint compiled and smoke-tested. Full M4 release waits for smart bins/archive/relink gates.'
